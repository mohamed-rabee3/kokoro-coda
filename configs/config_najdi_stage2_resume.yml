# Stage 2 RESUME after the joint-phase crash.
#
# The original run died at the joint_epoch transition with
# UnboundLocalError: 'ref'. Cause: train_second.py assigns `ref` under
# (multispeaker and epoch >= diff_epoch) but reads it under `multispeaker`
# alone. With diffusion disabled (diff_epoch 999) and multispeaker true, it is
# read while never assigned. Upstream never hits this (diff_epoch 10 <
# joint_epoch 30); kikiri never hits it (multispeaker false). Fixed by binding
# ref = None; it is dead anyway since SLMAdversarialLoss gets
# diffusion_enabled=False and never reads ref_s.
#
# Resume specifics:
#   pretrained_model + second_stage_load_pretrained: true -> take the epoch-2
#     Stage 2 checkpoint, not first_stage.pth.
#   load_only_params: false -> restore optimizer state and start_epoch=2.
#   joint_epoch: 2 -> adversarial fires on the first resumed epoch, so the fix
#     is validated in minutes rather than after another 4 h epoch. Also yields
#     8 adversarial epochs (2..9) instead of 7.
#
# NOTE the resume branch also re-inits predictor_encoder from style_encoder,
# which would discard the Stage 2 prosody-encoder training already done. Patched
# in train_second.py to detect a trained predictor_encoder and keep it.
#
# RESUME POINT: epoch_2nd_00006.pth (epoch index 6, saved 2026-08-10 06:55).
# Stopped by request mid-epoch-7; StyleTTS2 only checkpoints on even epochs, so
# the ~4.3 h of epoch 7 in flight is not recoverable and epoch 7 restarts.
# load_only_params: false restores optimizer state and start_epoch=6, so this
# runs epochs 6..9 with adversarial active throughout (joint_epoch 2 <= 6).

log_dir: /home/ai2/kokoro-coda/runs/stage2
save_freq: 2
log_interval: 10
device: cuda
batch_size: 6
max_len: 200
epochs: 10
pretrained_model: /home/ai2/kokoro-coda/runs/stage2/epoch_2nd_00006.pth
load_only_params: false
F0_path: Utils/JDC/bst.t7
ASR_config: Utils/ASR/config.yml
ASR_path: Utils/ASR/epoch_00080.pth
PLBERT_dir: Utils/PLBERT/
data_params:
  train_data: /home/ai2/kokoro-coda/data/train_list.txt
  val_data: /home/ai2/kokoro-coda/data/val_list.txt
  root_path: /home/ai2/kokoro-coda/data/audio
  OOD_data: /home/ai2/kokoro-coda/data/OOD_texts.txt
  min_length: 50
  num_workers: 12
preprocess_params:
  sr: 24000
  spect_params:
    n_fft: 2048
    win_length: 1200
    hop_length: 300
model_params:
  dim_in: 64
  hidden_dim: 512
  max_conv_dim: 512
  n_layer: 3
  n_mels: 80
  n_token: 178
  max_dur: 50
  style_dim: 128
  dropout: 0.2
  text_encoder_kernel_size: 5
  multispeaker: true
  decoder:
    type: istftnet
    resblock_kernel_sizes:
    - 3
    - 7
    - 11
    upsample_rates:
    - 10
    - 6
    upsample_initial_channel: 512
    resblock_dilation_sizes:
    - - 1
      - 3
      - 5
    - - 1
      - 3
      - 5
    - - 1
      - 3
      - 5
    upsample_kernel_sizes:
    - 20
    - 12
    gen_istft_n_fft: 20
    gen_istft_hop_size: 5
  slm:
    model: microsoft/wavlm-base-plus
    sr: 16000
    hidden: 768
    nlayers: 13
    initial_channel: 64
  diffusion:
    embedding_mask_proba: 0.1
    transformer:
      num_layers: 3
      num_heads: 8
      head_features: 64
      multiplier: 2
    dist:
      sigma_data: 0.2
      estimate_sigma_data: true
      mean: -3.0
      std: 1.0
  plbert:
    hidden_size: 768
    num_attention_heads: 12
    intermediate_size: 2048
    max_position_embeddings: 512
    num_hidden_layers: 12
    dropout: 0.1
loss_params:
  lambda_mel: 5.0
  lambda_gen: 1.0
  lambda_slm: 1.0
  lambda_mono: 1.0
  lambda_s2s: 1.0
  lambda_F0: 1.0
  lambda_norm: 1.0
  lambda_dur: 1.0
  lambda_ce: 20.0
  lambda_sty: 0.0
  lambda_diff: 0.0
  diff_epoch: 999
  TMA_epoch: 0
  joint_epoch: 2
optimizer_params:
  lr: 0.0001
  bert_lr: 1.0e-05
  ft_lr: 5.0e-05
slmadv_params:
  min_len: 100
  max_len: 500
  batch_percentage: 0.5
  iter: 10
  thresh: 5
  scale: 0.01
  sig: 1.5
epochs_2nd: 10
second_stage_load_pretrained: true
first_stage_path: first_stage.pth
