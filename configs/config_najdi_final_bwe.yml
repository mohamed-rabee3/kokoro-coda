  lambda_s2s: 1.0
  lambda_F0: 1.0
  lambda_norm: 1.0
  lambda_dur: 1.0
  lambda_ce: 20.0
  lambda_sty: 0.0
  lambda_diff: 0.0
  diff_epoch: 999
  TMA_epoch: 0
  joint_epoch: 0
optimizer_params:
